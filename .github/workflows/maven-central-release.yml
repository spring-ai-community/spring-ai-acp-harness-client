name: Release to Maven Central

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_SECRET_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Run on a -SNAPSHOT version, the deploy below would publish another snapshot and
      # report success, which looks like a release that never happened.
      - name: Refuse a -SNAPSHOT version
        run: |
          VERSION=$(./mvnw help:evaluate -Dexpression=project.version --quiet -DforceStdout)
          if [[ "${VERSION}" == *-SNAPSHOT ]]; then
            echo "::error::${VERSION} is a -SNAPSHOT version. Run this workflow on the tag of a release commit."
            exit 1
          fi

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Publish to Maven Central
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: ./mvnw --batch-mode --no-transfer-progress -Prelease deploy
