name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'CHANGELOG.md'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.x

      - run: pip install mkdocs-material mike

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy docs (push to main)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          PROJECT_VERSION=$(./mvnw help:evaluate -Dexpression=project.version --quiet -DforceStdout)
          if [[ "${PROJECT_VERSION}" == *-SNAPSHOT ]]; then
            ALIAS="latest-snapshot"
          else
            ALIAS="latest"
          fi
          mike deploy --push --update-aliases "${PROJECT_VERSION}" "${ALIAS}"
          # Once main has moved to the next snapshot, the previous one's docs describe
          # artifacts nobody publishes any more, so take them out of the version selector.
          if [[ "${ALIAS}" == "latest-snapshot" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            mike list --json \
              | jq -r --arg current "${PROJECT_VERSION}" \
                  '.[].version | select(endswith("-SNAPSHOT") and . != $current)' \
              | while read -r old; do
                  mike delete --push "${old}"
                done
          fi

      - name: Deploy versioned docs (release)
        if: github.event_name == 'release'
        run: |
          # Tags are v-prefixed (v0.5.0); publish under the plain version.
          VERSION=${GITHUB_REF_NAME#v}
          # `latest` goes to the newest release in versions.json, so a patch to an older
          # line (0.6.2 after 0.7.0) is published without taking it.
          NEWEST=$({ mike list --json | jq -r '.[].version | select(endswith("-SNAPSHOT") | not)'; \
            echo "${VERSION}"; } | sort -V | tail -n 1)
          if [[ "${VERSION}" == "${NEWEST}" ]]; then
            mike deploy --push --update-aliases "${VERSION}" latest
          else
            mike deploy --push "${VERSION}"
          fi

      - name: Choose the version the site opens on
        run: |
          # versions.json on gh-pages decides: the latest release once there is one,
          # and main's snapshot until then. Set on every deploy, so a docs change on
          # main no longer moves readers off the release.
          if mike list --json | jq -e 'any(.[]; .aliases | index("latest"))' > /dev/null; then
            mike set-default latest --push
          else
            mike set-default latest-snapshot --push
          fi
